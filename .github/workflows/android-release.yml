name: android-release

# Builds, tests, signs and publishes the ReadMeTales Android app from the private app repo.
# Run it from the Actions tab ("Run workflow") with a version like 0.4.0.
# Secrets: APP_REPO_TOKEN, ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_PASSWORD,
#          R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, R2_ENDPOINT.
# Variables (optional): API_BASE_URL (default https://readmetales.vercel.app), CLERK_PUBLISHABLE_KEY (default: the
#   current public Clerk key; set it when switching to a production Clerk instance), R2_BUCKET (default readmetales).
on:
  workflow_dispatch:
    inputs:
      version: { description: 'Version name, e.g. 0.4.0', required: true }
      notes: { description: 'What is new (shown in the app update prompt)', required: false, default: '' }
      publish: { description: 'Publish to users (false = build and test only)', type: boolean, default: true }

permissions:
  contents: read

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: android
    env:
      # above the old app repo's run numbers (last release used 9) so phones accept the update
      ANDROID_VERSION_CODE: ${{ github.run_number }}0
      ANDROID_VERSION_NAME: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: eghazal27/readmetales
          ref: main
          token: ${{ secrets.APP_REPO_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            if [ "${{ inputs.publish }}" = "true" ]; then echo "::error::ANDROID_KEYSTORE_BASE64 is empty; refusing to publish an unsigned app"; exit 1; fi
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
      - name: Test and build
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          API_BASE_URL: ${{ vars.API_BASE_URL || 'https://readmetales.vercel.app' }}
          CLERK_PUBLISHABLE_KEY: ${{ vars.CLERK_PUBLISHABLE_KEY || 'pk_test_Y2FwaXRhbC1tYWNhcXVlLTc4NDguY2xlcmsuYWNjb3VudHMuZGV2JA' }}
        run: chmod +x gradlew && ./gradlew :app:testDebugUnitTest :app:assembleRelease "-Preadmetales.apiBaseUrl=$API_BASE_URL" "-Preadmetales.clerkPublishableKey=$CLERK_PUBLISHABLE_KEY"
      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: android/app/build/outputs/apk/release/app-release*.apk
          if-no-files-found: error
      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"

  release:
    if: inputs.publish
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: app-release
          path: dist
      - name: Publish to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ vars.R2_BUCKET || 'readmetales' }}
          VERSION: ${{ inputs.version }}
          NOTES: ${{ inputs.notes }}
          CODE: ${{ github.run_number }}0
        run: |
          shopt -s nullglob
          apks=(dist/app-release*.apk)
          if [ "${#apks[@]}" -ne 1 ] || [[ "${apks[0]}" == *unsigned* ]]; then
            echo "::error::expected exactly one signed APK, found: ${apks[*]}"
            exit 1
          fi
          aws s3 cp "${apks[0]}" "s3://$R2_BUCKET/app/readmetales-$VERSION.apk" \
            --endpoint-url "$R2_ENDPOINT" --content-type application/vnd.android.package-archive
          jq -n --argjson code "$CODE" --arg name "$VERSION" --arg key "app/readmetales-$VERSION.apk" --arg notes "$NOTES" \
            '{versionCode: $code, versionName: $name, apkKey: $key, notes: $notes}' > latest.json
          aws s3 cp latest.json "s3://$R2_BUCKET/app/latest.json" \
            --endpoint-url "$R2_ENDPOINT" --content-type application/json --cache-control no-store
